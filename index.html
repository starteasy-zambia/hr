  const variants = { primary: { background: 'linear-gradient(135deg,#E8730F,#F5A623)', color: '#fff' }, dark: { background: '#0A1F12', color: '#fff' }, ghost: { background: '#fff', color: '#0A1F12', border: '1px solid rgba(10,31,18,.15)' }, success: { background: '#1E7B3C', color: '#fff' }, whatsapp: { background: '#25D366', color: '#fff' }, email: { background: '#1B6CA8', color: '#fff' }, danger: { background: '#B8564F', color: '#fff' } };
  return <button type={type} onClick={onClick} disabled={disabled} style={{ ...base, ...sizes[size], ...variants[variant], ...style }}>{children}</button>;
};

function firebaseErrorMsg(err, context = 'auth') {
  const code = err && err.code;
  if (code === 'permission-denied') return "Database Permission Denied! Your Firebase Security Rules are blocking access.";
  if (code === 'auth/email-already-in-use') return "This email is already registered. Please log in instead.";
  if (code === 'auth/invalid-email') return "That email address doesn't look valid.";
  if (code === 'auth/weak-password') return "Your password is too weak. Please use at least 6 characters.";
  if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential')
    return context === 'login' ? "Incorrect email or password." : "We couldn't find an account with that email.";
  if (code === 'auth/too-many-requests') return "Too many attempts. Please wait a few minutes and try again.";
  return (err && err.message) || "Something went wrong. Please try again.";
}

function App() {

  // Contract state

  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const [itRequest, setItRequest] = useState('');
  const [itRequestSent, setItRequestSent] = useState(false);
  const [isDownloading, setIsDownloading] = useState(false);

  // Auth state
  const [user, setUser] = useState(null);
  const [userData, setUserData] = useState(null);
  const [teamMembers, setTeamMembers] = useState([]);
  const [resources, setResources] = useState([]);
  const [inviteLogs, setInviteLogs] = useState([]);
  const [authLoading, setAuthLoading] = useState(true);
  const [missingProfile, setMissingProfile] = useState(false);

  const [photoFile, setPhotoFile] = useState(null);
  const [photoPreview, setPhotoPreview] = useState('');

  const [photoSaving, setPhotoSaving] = useState(false);

  const [uploadingRes, setUploadingRes] = useState(false);

  const [resFile, setResFile] = useState(null);

  const [loginPassword, setLoginPassword] = useState('');
  const [resetEmail, setResetEmail] = useState('');

  // Listen to Auth
  useEffect(() => {
    const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
      if (currentUser) {
        if (currentUser.isAnonymous) {
          await auth.signOut();
          setUser(null); setUserData(null);
          setAuthError("Session conflict: Please log in with your email and password.");
          setAuthLoading(false);
          return;
        }

        setUser(currentUser);
        try {
          let snap = null;
          for (let attempt = 0; attempt < 4; attempt++) {
            snap = await db.collection('se_appointees').doc(currentUser.uid).get();
            if (snap.exists) break;
            await new Promise(r => setTimeout(r, 700));
          }
          if (snap && snap.exists) {
            const data = snap.data();
            setUserData(data);
            setView('dashboard');
          } else {
            setMissingProfile(true);
            setView('recover-profile');
          }
        } catch (e) {
          setUser(null); setUserData(null);
          setAuthError(e.code === 'permission-denied' ? "Database Permission Denied. Check rules." : "Failed to load profile: " + e.message);
          auth.signOut();
        }
      } else {
        setUser(null); setUserData(null);
        setMissingProfile(false);
      }
      setBusy(false);
      setAuthLoading(false);
    });
    return () => unsubscribe();
  }, []);

  // Fetch Team Members, Resources & Logs
  useEffect(() => {
    if (!userData) return;
    
    const unsubTeam = db.collection('se_appointees').onSnapshot(snap => {
      setTeamMembers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, (err) => console.warn("Team fetch error:", err.message));

    const unsubRes = db.collection('se_resources').onSnapshot(snap => {
      setResources(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, (err) => console.warn("Resource fetch error:", err.message));

    const unsubLogs = db.collection('se_invite_logs').orderBy('timestamp', 'desc').onSnapshot(snap => {
      setInviteLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, (err) => console.warn("Logs fetch error:", err.message));

    return () => { unsubTeam(); unsubRes(); unsubLogs(); };
  }, [userData]);

  // Handle Profile Picture
  const handlePhotoSelect = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) return alert("File is too large. Please select an image under 5MB.");
    setPhotoFile(file);
    setPhotoPreview(URL.createObjectURL(file));
  };

  const handleUpdatePhoto = async () => {
    if (!user || !photoFile) return;
    setPhotoSaving(true);
    try {
      const formData = new FormData();
      formData.append('file', photoFile);
      formData.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/auto/upload`, {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (data.secure_url) {
        await db.collection('se_appointees').doc(user.uid).update({ photoUrl: data.secure_url });
        setUserData(prev => ({ ...prev, photoUrl: data.secure_url }));
        setShowPhotoEdit(false);
        setPhotoFile(null);
        setPhotoPreview('');
      } else {
        throw new Error(data.error?.message || "Failed to upload to Cloudinary");
      }
    } catch (e) {
      alert("Failed to update photo: " + e.message);
    } finally {
      setPhotoSaving(false);
    }
  };

  // Handle Resource Upload
  const handleUploadResource = async (e) => {
    e.preventDefault();
    if (!resFile) return alert('Please select a file to upload.');

    setUploadingRes(true);
    try {
      const formData = new FormData();
      formData.append('file', resFile);
      formData.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/auto/upload`, {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (data.secure_url) {
        await db.collection('se_resources').add({
          title: resTitle,
          desc: resDesc,
          url: data.secure_url,
          fileName: resFile.name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        setResTitle('');
        setResDesc('');
        setResFile(null);
        e.target.reset();
        alert('Resource uploaded successfully!');
      } else {
        throw new Error(data.error?.message || "Failed to upload to Cloudinary");
      }
    } catch (err) {
      alert("Upload failed: " + err.message);

      setUploadingRes(false);
    }
  };

    try {

      alert("Error deleting: " + err.message);
    }

      alert("Error deleting member: " + err.message);
    }
  };

  // Profile Recovery
  const handleRecoverProfile = async (e) => {

    if (!form.name.trim() || !form.phone.trim() || !form.location.trim()) return setError('Please fill in all fields.');
    const chosenRole = ROLES['ceo'];

        location: form.location.trim(),
        roleId: chosenRole.id,
        roleTitle: chosenRole.title,
        photoUrl: '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      await db.collection('se_appointees').doc(user.uid).set(profile);
      setUserData(profile);
      setMissingProfile(false);
      setView('dashboard');
    } catch (err) {
      setError("Failed to save profile: " + err.message);
    } finally {
      setBusy(false);
    }
  };

        email: form.email.trim().toLowerCase(),
        phone: form.phone.trim(),
        location: form.location.trim(),

        roleTitle: selectedRole.title,

      setView('dashboard');

    } catch (err) {

      setAuthError(firebaseErrorMsg(err, 'signup') + " (We rolled back the login attempt to keep our database clean).");
    } finally {
      setBusy(false);
    }
  };

              </div>
              
              <p>This Agreement of Engagement (the "Agreement") is entered into on this {new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' })} by and between <strong>StartEasy Zambia</strong> (the "Company") and <strong>{form.name || '[Applicant Name]'}</strong> (the "Appointee").</p>

              <h4>1. Appointment and Reporting</h4>
              <p>The Company hereby appoints the Appointee to the position of <strong>{selectedRole.title}</strong>. {selectedRole.reporting}</p>

              <h4>2. Scope of Work and Responsibilities</h4>
              <p>The Appointee agrees to perform the following duties and responsibilities:</p>
              <ul>{selectedRole.responsibilities.map((item, i) => <li key={i} dangerouslySetInnerHTML={{__html: fmt(item)}} />)}</ul>

              <h4>3. Compensation and Benefits</h4>
              <p>In consideration of the services rendered, the Appointee shall be entitled to the following:</p>
              <ul>{selectedRole.compensation.map((item, i) => <li key={i} dangerouslySetInnerHTML={{__html: fmt(item)}} />)}</ul>

              <h4>4. Terms and Conditions</h4>
              <ul>{selectedRole.terms.map((item, i) => <li key={i} dangerouslySetInnerHTML={{__html: fmt(item)}} />)}</ul>

              <h4>5. General Provisions</h4>
              <p><strong>Governing Law:</strong> This Agreement shall be governed by and construed in accordance with the laws of the Republic of Zambia.</p>
              <p><strong>Entire Agreement:</strong> This Agreement constitutes the entire agreement between the parties and supersedes all prior discussions, understandings, and agreements.</p>

              <h4>6. Appointee Details</h4>
              <div className="form-grid-2">
                <span><strong>Full Name:</strong><br/><input className="doc-input-line" value={form.name} readOnly /></span>
                <span><strong>Email Address:</strong><br/><input className="doc-input-line" type="email" value={form.email} readOnly /></span>
                <span><strong>Phone Number:</strong><br/><input className="doc-input-line" value={form.phone} readOnly /></span>
                <span><strong>Physical Location:</strong><br/><input className="doc-input-line" value={form.location} readOnly /></span>
              </div>

              <h4>7. Acceptance and Signature</h4>
              <p>By signing below, the Appointee acknowledges that they have read, understood, and agree to be bound by the terms of this Agreement.</p>
              
              <div className="highlight-box">
                <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
                  <i className="fas fa-check-square" style={{ color: '#E8730F', fontSize: 20 }}></i>
                  <span style={{ fontSize: 13.5, fontWeight: 600 }}>I accept the terms of this agreement.</span>
                </div>
              </div>
              <div className="sign">
                <div><div className="sigval" style={{ color: '#1B6CA8' }}>Mwaba Lewis</div><div className="lbl">For StartEasy Zambia</div></div>
                <div><div className="sigval" style={{ color: '#E8730F' }}>{form.name || '_________________________'}</div><div className="lbl">The Appointee</div></div>
              </div>
            </div>
          </div>
        )}

        {/* ─── CREATE ACCOUNT ─── */}
        {view === 'create-account' && selectedRole && (
          <div className="fadein main-container" style={{ minHeight: '80vh', justifyContent: 'center' }}>
            <div style={{ maxWidth: 500, width: '100%', background: '#fff', padding: 40, borderRadius: 16 }}>
              <div style={{ textAlign: 'center', marginBottom: 24 }}>
                <h2 className="serif" style={{ fontSize: 26, color: '#0A1F12', margin: '0 0 8px' }}>Create Account</h2>
                <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.6)' }}>Set a password to access your workspace.</p>
              </div>
              <form onSubmit={handleCreateAccount}>
                <label style={{ display: 'block', fontSize: 12, fontWeight: 700, marginBottom: 6 }}>Email</label>
                <input type="email" value={form.email} readOnly style={{ width: '100%', padding: 12, background: '#f9f9f9', border: '1px solid #eee', borderRadius: 8, marginBottom: 16 }} />
                <label style={{ display: 'block', fontSize: 12, fontWeight: 700, marginBottom: 6 }}>Create Password</label>
                <div style={{ marginBottom: 16 }}><PasswordField value={authPassword} onChange={e => setAuthPassword(e.target.value)} /></div>
                <label style={{ display: 'block', fontSize: 12, fontWeight: 700, marginBottom: 6 }}>Confirm Password</label>
                <div style={{ marginBottom: 16 }}><PasswordField value={authConfirmPassword} onChange={e => setAuthConfirmPassword(e.target.value)} /></div>
                {authError && <div style={{ color: '#B8564F', fontSize: 13, marginBottom: 16, fontWeight: 600 }}>{authError}</div>}
                <Btn type="submit" disabled={busy} size="lg" variant="primary" style={{ width: '100%' }}>{busy ? 'Creating...' : 'Create Account'}</Btn>
              </form>
            </div>
          </div>
        )}

        {/* ─── DASHBOARD FALLBACK ─── */}
        {view === 'dashboard' && !userData && (
          <div className="fadein main-container" style={{ minHeight: '60vh', justifyContent: 'center' }}>
            <div style={{ background: '#fff', padding: 40, borderRadius: 16, textAlign: 'center', maxWidth: 450 }}>
              <h2 className="serif" style={{ fontSize: 24, color: '#0A1F12', marginBottom: 12 }}>Profile Not Found</h2>
              <Btn onClick={handleLogout} variant="primary" style={{ width: '100%' }}>Log Out & Try Again</Btn>
            </div>
          </div>
        )}

        {/* ─── DASHBOARD ─── */}
        {view === 'dashboard' && userData && (
          <div className="fadein main-container" style={{ minHeight: '100vh' }}>
            <div style={{ maxWidth: 900, margin: '0 auto', width: '100%' }}>
              <div style={{ background: 'linear-gradient(135deg,#0A1F12,#123A1F)', padding: '40px', borderRadius: 16, textAlign: 'center', marginBottom: 32, color: '#fff' }}>
                <h1 className="serif" style={{ fontSize: 32, margin: '0 0 12px' }}>Welcome to the Team, {userData.name.split(' ')[0]}!</h1>
                <p style={{ fontSize: 16, color: 'rgba(255,255,255,0.8)' }}>Role: <strong>{userData.roleTitle}</strong></p>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 24, marginBottom: 32 }}>
                <div style={{ background: '#0A1F12', borderRadius: 16, padding: 32, color: '#fff' }}>
                  <h3 className="serif" style={{ fontSize: 22, color: '#F5A623', marginBottom: 12 }}>Message from the Founder</h3>
                  <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.8)', lineHeight: 1.7, marginBottom: 20 }}>
                    "Welcome aboard. We are building something truly special here at StartEasy Zambia. Your role is critical to our success."
                  </p>
                  <p style={{ fontSize: 14, fontWeight: 700 }}>— Mwaba Lewis, Founder</p>
                </div>

                <div style={{ background: '#fff', borderRadius: 16, padding: 32, border: '1px solid rgba(10,31,18,0.08)' }}>
                  <h3 style={{ fontSize: 18, fontWeight: 800, marginBottom: 16 }}>Request IT Setup</h3>
                  {itRequestSent ? (
                    <div style={{ background: '#EAF7EE', color: '#1E7B3C', padding: 16, borderRadius: 8, textAlign: 'center', fontSize: 14, fontWeight: 600 }}>Request Sent!</div>
                  ) : (
                    <form onSubmit={submitITRequest}>
                      <textarea value={itRequest} onChange={e => setItRequest(e.target.value)} placeholder="Need a laptop or software?" style={{ width: '100%', height: 80, padding: 12, border: '1px solid #ccc', borderRadius: 8, marginBottom: 16 }} />
                      <Btn type="submit" variant="ghost" style={{ width: '100%' }}>Send Request</Btn>
                    </form>
                  )}
                </div>
              </div>

              <div style={{ background: '#fff', borderRadius: 16, padding: 32, border: '1px solid rgba(10,31,18,0.08)', boxShadow: '0 10px 30px rgba(0,0,0,0.03)', width: '100%', marginBottom: 32 }}>
                <h2 style={{ fontSize: 20, fontWeight: 800, color: '#0A1F12', marginBottom: 24, display: 'flex', alignItems: 'center', gap: 12 }}>
                  <i className="fas fa-laptop-code" style={{ color: '#E8730F' }}></i> Your Remote Workspace
                </h2>

                <div style={{ display: 'grid', gap: 16 }}>
                  {[
                    { title: 'Team WhatsApp Group', desc: 'Join the internal group for instant communication.', icon: 'fa-whatsapp', color: '#25D366', link: 'https://chat.whatsapp.com/KvfbdH4Aw7f7bericuwSyx', btn: 'Join WhatsApp' },
                    { title: 'StartEasy Slack Workspace', desc: 'Our primary tool for project channels and daily updates.', icon: 'fa-slack', color: '#4A154B', link: 'https://slack.com/mock-invite', btn: 'Open Slack' },
                    { title: 'Company Notion Wiki', desc: 'Access all SOPs, brand guidelines, and project boards.', icon: 'fa-book', color: '#000000', link: 'https://notion.so/mock-invite', btn: 'Open Notion' },
                  ].map((task, i) => (
                    <div key={i} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: 16, border: '1px solid #eee', borderRadius: 8, flexWrap: 'wrap', gap: 16 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                        <div style={{ width: 44, height: 44, borderRadius: 10, background: `${task.color}15`, color: task.color, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 22 }}>
                          <i className={`fab ${task.icon}`}></i>
                        </div>
                        <div>
                          <h4 style={{ fontSize: 15, fontWeight: 700, margin: '0 0 4px', color: '#0A1F12' }}>{task.title}</h4>
                          <p style={{ fontSize: 13, color: 'rgba(10,31,18,0.6)', margin: 0 }}>{task.desc}</p>
                        </div>
                      </div>
                      <a href={task.link} target="_blank" rel="noopener noreferrer" style={{ textDecoration: 'none' }}>
                        <Btn size="md" variant="dark">{task.btn} <i className="fas fa-external-link-alt" style={{ fontSize: 12, marginLeft: 4 }}></i></Btn>
                      </a>
                    </div>
                  ))}
                </div>
              </div>

              {/* ADMIN UPLOAD */}
              {isAdmin && (
                <div style={{ background: '#FFF9E6', borderRadius: 16, padding: 32, border: '1px solid #F0E0A0', marginBottom: 32 }}>
                  <h2 style={{ fontSize: 20, fontWeight: 800, color: '#8A6828', marginBottom: 8 }}><i className="fas fa-cloud-upload-alt"></i> Admin: Upload New Resource</h2>
                  <form onSubmit={handleUploadResource} style={{ display: 'grid', gap: 12 }}>
                    <input type="text" placeholder="Document Title" value={resTitle} onChange={e => setResTitle(e.target.value)} required style={{ padding: 10, border: '1px solid #ccc', borderRadius: 6 }} />
                    <input type="text" placeholder="Short Description" value={resDesc} onChange={e => setResDesc(e.target.value)} required style={{ padding: 10, border: '1px solid #ccc', borderRadius: 6 }} />
                    <input type="file" onChange={e => setResFile(e.target.files[0])} required style={{ padding: 10, background: '#fff', border: '1px solid #ccc', borderRadius: 6 }} />
                    <Btn type="submit" disabled={uploadingRes} variant="dark" style={{ marginTop: 8 }}>{uploadingRes ? 'Uploading...' : 'Upload Resource'}</Btn>
                  </form>
                </div>
              )}

              {/* ADMIN: VIEW LOGS */}
              {isAdmin && (
                <div style={{ background: '#fff', borderRadius: 16, padding: 32, border: '1px solid rgba(10,31,18,0.08)', marginBottom: 32 }}>
                  <h2 style={{ fontSize: 20, fontWeight: 800, marginBottom: 24 }}>Admin: Code Entry Logs</h2>
                  <div style={{ overflowX: 'auto' }}>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                      <thead>
                        <tr style={{ background: '#F9FBFA', borderBottom: '1px solid #eee' }}>
                          <th style={{ padding: 12, textAlign: 'left', fontWeight: 700 }}>Code</th>
                          <th style={{ padding: 12, textAlign: 'left', fontWeight: 700 }}>Role</th>
                          <th style={{ padding: 12, textAlign: 'left', fontWeight: 700 }}>Time</th>
                        </tr>
                      </thead>
                      <tbody>
                        {inviteLogs.length === 0 ? (
                          <tr><td colSpan="3" style={{ padding: 20, textAlign: 'center', color: 'rgba(10,31,18,0.5)' }}>No code entries recorded yet.</td></tr>
                        ) : (
                          inviteLogs.map(log => (
                            <tr key={log.id} style={{ borderBottom: '1px solid #eee' }}>
                              <td style={{ padding: 12, fontWeight: 700 }}>{log.code}</td>
                              <td style={{ padding: 12 }}>{log.roleTitle}</td>
                              <td style={{ padding: 12, color: 'rgba(10,31,18,0.6)' }}>
                                {log.timestamp ? new Date(log.timestamp.toDate()).toLocaleString() : 'Pending...'}
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* ADMIN: VIEW ALL APPOINTEES */}
              {isAdmin && (
                <div style={{ background: '#fff', borderRadius: 16, padding: 32, border: '1px solid rgba(10,31,18,0.08)', marginBottom: 32 }}>
                  <h2 style={{ fontSize: 20, fontWeight: 800, marginBottom: 24 }}>Admin: Registered Appointees</h2>
                  <div style={{ overflowX: 'auto' }}>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                      <thead>
                        <tr style={{ background: '#F9FBFA', borderBottom: '1px solid #eee' }}>
                          <th style={{ padding: 12, textAlign: 'left', fontWeight: 700 }}>Name</th>
                          <th style={{ padding: 12, textAlign: 'left', fontWeight: 700 }}>Email</th>
                          <th style={{ padding: 12, textAlign: 'left', fontWeight: 700 }}>Role</th>
                        </tr>
                      </thead>
                      <tbody>
                        {teamMembers.map(member => (
                          <tr key={member.id} style={{ borderBottom: '1px solid #eee' }}>
                            <td style={{ padding: 12, fontWeight: 700 }}>{member.name}</td>
                            <td style={{ padding: 12 }}>{member.email}</td>
                            <td style={{ padding: 12 }}>{member.roleTitle}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TEAM SECTION */}
              <div style={{ background: '#fff', borderRadius: 16, padding: 32, border: '1px solid rgba(10,31,18,0.08)' }}>
                <h2 style={{ fontSize: 20, fontWeight: 800, marginBottom: 24 }}>Meet the Founding Team</h2>
                
                {showPhotoEdit && (
                  <div style={{ background: '#F9FBFA', padding: 24, borderRadius: 12, marginBottom: 32, border: '1px solid #E8730F', textAlign: 'center' }}>
                    <h3 style={{ fontSize: 16, fontWeight: 800, marginBottom: 16, color: '#0A1F12' }}>Upload Profile Picture</h3>
                    
                    {photoPreview && (
                      <div style={{ marginBottom: 16 }}>
                        <img src={photoPreview} alt="Preview" style={{ width: 100, height: 100, borderRadius: '50%', objectFit: 'cover', margin: '0 auto', border: '3px solid #E8730F' }} />
                      </div>
                    )}

                    <input 
                      type="file" 
                      accept="image/*" 
                      onChange={handlePhotoSelect} 
                      style={{ display: 'block', width: '100%', maxWidth: 300, margin: '0 auto 16px', padding: 10, background: '#fff', border: '1px solid #ccc', borderRadius: 6, fontSize: 13 }} 
                    />
                    
                    <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
                      <Btn onClick={handleUpdatePhoto} disabled={!photoFile || photoSaving} size="md" variant="primary">
                        {photoSaving ? <><i className="fas fa-circle-notch spin"></i> Uploading...</> : 'Upload & Save'}
                      </Btn>
                      <Btn onClick={() => { setShowPhotoEdit(false); setPhotoFile(null); setPhotoPreview(''); }} size="md" variant="ghost">
                        Cancel
                      </Btn>
                    </div>
                  </div>
                )}

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 16 }}>
                  
                  {/* Current User */}
                  <div style={{ textAlign: 'center', padding: 20, border: '2px solid #E8730F', borderRadius: 12, background: '#FFF9E6', position: 'relative' }}>
                    <button onClick={() => setShowPhotoEdit(!showPhotoEdit)} style={{ position: 'absolute', top: 10, right: 10, background: 'none', border: 'none', color: '#E8730F', cursor: 'pointer' }} title="Update Photo"><i className="fas fa-camera"></i></button>
                    <div style={{ width: 88, height: 88, borderRadius: '50%', background: 'linear-gradient(135deg, #1E7B3C, #E8730F)', padding: '4px', margin: '0 auto 12px' }}>
                      <div style={{ width: '100%', height: '100%', borderRadius: '50%', overflow: 'hidden', background: '#fff' }}>
                        <img src={userData.photoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.name)}&background=0A1F12&color=fff&size=80`} onError={(e) => handleImageError(e, userData.name)} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                      </div>
                    </div>
                    <h4 style={{ fontSize: 16, fontWeight: 700 }}>{userData.name} (You)</h4>
                    <p style={{ fontSize: 12, color: '#E8730F', fontWeight: 700, textTransform: 'uppercase' }}>{userData.roleTitle}</p>
                  </div>

                  {/* Hardcoded Founder (If current user is not Mwaba) */}
                  {userData.email !== 'lewismwaba@gmail.com' && (
                    <div style={{ textAlign: 'center', padding: 20, border: '1px solid #eee', borderRadius: 12 }}>
                      <div style={{ width: 88, height: 88, borderRadius: '50%', background: 'linear-gradient(135deg, #1E7B3C, #E8730F)', padding: '4px', margin: '0 auto 12px' }}>
                        <div style={{ width: '100%', height: '100%', borderRadius: '50%', overflow: 'hidden', background: '#fff' }}>
                          <img src="cropped-1713948169242.jpg" onError={(e) => handleImageError(e, 'Mwaba Lewis')} alt="Mwaba Lewis" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                        </div>
                      </div>
                      <h4 style={{ fontSize: 16, fontWeight: 700 }}>Mwaba Lewis</h4>
                      <p style={{ fontSize: 12, color: '#1E7B3C', fontWeight: 700, textTransform: 'uppercase' }}>Founder</p>
                    </div>
                  )}

                  {/* Dynamic Team Members */}
                  {teamMembers.filter(m => m.id !== user.uid).map(member => (
                    <div key={member.id} style={{ textAlign: 'center', padding: 20, border: '1px solid #eee', borderRadius: 12, position: 'relative' }}>
                      
                      {/* SECURITY CHECK: Only render the delete button if the logged-in user is the Admin */}
                      {isAdmin && (
                        <button 
                          onClick={() => handleDeleteMember(member.id, member.name)} 
                          style={{ position: 'absolute', top: 10, right: 10, background: '#FFE8E5', border: 'none', color: '#B8564F', cursor: 'pointer', borderRadius: '50%', width: 28, height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center' }} 
                          title="Remove Member"
                        >
                          <i className="fas fa-trash"></i>
                        </button>
                      )}

                      <div style={{ width: 88, height: 88, borderRadius: '50%', background: 'linear-gradient(135deg, #1E7B3C, #E8730F)', padding: '4px', margin: '0 auto 12px' }}>
                        <div style={{ width: '100%', height: '100%', borderRadius: '50%', overflow: 'hidden', background: '#fff' }}>
                          <img src={member.photoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(member.name)}&background=0A1F12&color=fff&size=80`} onError={(e) => handleImageError(e, member.name)} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                        </div>
                      </div>
                      <h4 style={{ fontSize: 16, fontWeight: 700 }}>{member.name}</h4>
                      <p style={{ fontSize: 12, color: '#1E7B3C', fontWeight: 700, textTransform: 'uppercase' }}>{member.roleTitle}</p>
                    </div>
                  ))}

                  {/* Fallback if no other members exist */}
                  {teamMembers.length === 0 && userData.email === 'lewismwaba@gmail.com' && (
                    <div style={{ gridColumn: '1 / -1', textAlign: 'center', padding: 20, color: 'rgba(10,31,18,0.5)', fontSize: 13, border: '1px dashed #ccc', borderRadius: 12 }}>
                      Waiting for other team members to complete their onboarding...
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        )}
      </main>

      <footer className="no-print" style={{ background: '#0A1F12', padding: '40px 24px', textAlign: 'center' }}>
        <p style={{ color: 'rgba(255,255,255,0.4)', fontSize: 13 }}>© {new Date().getFullYear()} StartEasy Zambia. All rights reserved.</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
